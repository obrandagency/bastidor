# Testa as regras de acesso do banco a cada push e, na main, aplica as migrations no Supabase.
name: Banco

on:
  push:
    paths: ["supabase/**", "scripts/testar-banco.sh", "scripts/aplicar-migrations.sh", ".github/workflows/banco.yml"]
  pull_request:
    paths: ["supabase/**", "scripts/testar-banco.sh", "scripts/aplicar-migrations.sh", ".github/workflows/banco.yml"]
  workflow_dispatch:

jobs:
  testar:
    name: Testar regras de acesso (RLS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: scripts/testar-banco.sh

  aplicar:
    name: Aplicar migrations no Supabase
    needs: testar
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: supabase-producao
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: omiibfgkvhndrwogsege
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar migrations pendentes
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Cadastre SUPABASE_ACCESS_TOKEN em Settings > Secrets and variables > Actions"
            exit 0
          fi
          # Em caso de erro, as últimas linhas viram anotações (aparecem no resumo do Actions)
          scripts/aplicar-migrations.sh > saida.txt 2>&1 || { cat saida.txt; tail -n 15 saida.txt | sed 's/^/::error::/'; exit 1; }
          cat saida.txt
