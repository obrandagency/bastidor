<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Bastidor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: trilho preto à esquerda + superfície branca de trabalho; o azul marca ação e estado */
:root{
  --bg:#FFFFFF; --surface:#F4F6FB; --card:#FFFFFF; --ink:#0A0C12; --muted:#5A6275; --line:#E2E6EF;
  --accent:#1E4BFF; --accent-ink:#FFFFFF;
  --rail:#FFFFFF; --rail-ink:#0A0C12; --rail-muted:#6B7385; --rail-line:#EEF1F6;
  --ok:#16895D; --ok-soft:#E3F5EC; --warn:#A86400; --warn-soft:#FFF1DA; --bad:#C93838; --bad-soft:#FDE8E8;
  --shadow:0 12px 40px rgba(10,12,18,.16); color-scheme:light;
  --display:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --accent-soft:color-mix(in srgb,var(--accent) 11%,var(--bg));
}
/* Tema único: sempre fundo branco, a pedido */

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
/* ---- trilho ---- */
.rail{background:var(--rail);color:var(--rail-ink);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;
  padding:20px 14px 24px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:17px}
.brand-name{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.02em}
.brand-sub{font-size:11px;color:var(--rail-muted);letter-spacing:.06em;text-transform:uppercase}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navlabel{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--rail-muted);padding:0 10px 6px}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--rail-ink);padding:8px 10px;border-radius:8px;text-align:left;font-size:13.5px}
.navbtn svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.navbtn:hover{background:var(--rail-line)}
.navbtn.on{background:var(--accent);color:var(--accent-ink)}
.navbtn.on svg{opacity:1}
.navbtn .count{margin-left:auto;font-family:var(--mono);font-size:11px;background:var(--rail-line);color:var(--rail-ink);border-radius:20px;padding:0 7px}
.navbtn.on .count{background:rgba(255,255,255,.22)}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--rail-line)}
.me small{display:block;color:var(--rail-muted);font-size:11.5px}

/* ---- topo mobile ---- */
.topbar{display:none}
.scrim{display:none}

/* ---- área principal ---- */
.main{min-width:0;padding-block:28px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.pagehead h1{font-size:30px;font-weight:700;line-height:1.1}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.lede{color:var(--muted);margin:6px 0 0;max-width:62ch}
.demo{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);border:1px dashed var(--line);border-radius:20px;padding:2px 10px}

.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--surface)}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-size:11.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.inp{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea.inp{resize:vertical;min-height:120px;line-height:1.55}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:12px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-h h3{font-size:15px;font-weight:700}
.panel-b{padding:14px 16px}
.muted{color:var(--muted)}
.empty{color:var(--muted);padding:18px 16px;font-size:13px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;border-radius:20px;padding:1px 9px;white-space:nowrap;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.st-cliente{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.st-ajuste{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.st-aprovado{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.st-agendado{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.late{color:var(--bad);font-weight:600}
.today{color:var(--warn);font-weight:600}

.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:10.5px;font-weight:600;background:var(--ink);color:var(--bg);flex:none;letter-spacing:.02em}
.av.lg{width:44px;height:44px;font-size:15px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:hsl(var(--h) 65% 48%)}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row .s{font-size:12.5px;color:var(--muted)}
.rowbtn{background:none;border:0;text-align:left;width:100%}
.rowbtn:hover{background:var(--surface)}

/* ---- números ---- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-family:var(--display);font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.alert b{color:var(--bad)}
.stat.hl{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stat.hl span{color:color-mix(in srgb,var(--bg) 70%,var(--ink))}

/* ---- miniatura de post (conteúdo, igual nos dois temas) ---- */
.tile{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:8px;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;
  background:radial-gradient(120% 80% at 90% 0%,hsl(var(--h) 80% 60% / .55),transparent 60%),linear-gradient(165deg,hsl(var(--h) 62% 40%),hsl(var(--h) 70% 16%))}
.tile-fmt{position:absolute;top:8px;left:8px;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.35);border-radius:4px;padding:1px 6px}
.tile-t{font-family:var(--display);font-weight:700;font-size:13px;line-height:1.12;text-wrap:balance;overflow-wrap:anywhere}
.tile-c{font-size:9.5px;opacity:.75;margin-top:4px;letter-spacing:.04em}
.tile.sm{width:44px;padding:4px;border-radius:5px;flex:none}
.tile.sm .tile-t{font-size:5.5px}.tile.sm .tile-fmt,.tile.sm .tile-c{display:none}

/* ---- kanban ---- */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.filters .field{width:200px;max-width:100%}
.board-wrap{overflow-x:auto;padding-bottom:10px;margin-inline:-4px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:250px;gap:12px;padding:0 4px;min-height:420px}
.kcol{background:var(--surface);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;border:1px solid transparent;transition:border-color .15s}
.kcol.over{border-color:var(--accent);background:var(--accent-soft)}
.kcol-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 4px;font-weight:600;font-size:13px}
.kcol-h .mono{font-size:11.5px;color:var(--muted)}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;cursor:grab;text-align:left}
.kcard:hover{border-color:var(--muted)}
.kcard.dragging{opacity:.4}
.kcard .ct{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.kcard .tt{font-weight:600;font-size:12.5px;line-height:1.3;overflow-wrap:anywhere;letter-spacing:.01em}
.kcard .ft{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.kcard .ft .sp{flex:1}
.adv{border:1px solid var(--line);background:none;border-radius:6px;width:26px;height:24px;display:grid;place-items:center;color:var(--muted)}
.adv:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.adjmark{color:var(--bad);font-weight:600}

/* ---- criação ---- */
.cria{display:grid;grid-template-columns:240px minmax(0,1fr) 320px;gap:16px;align-items:start}
.qlist .rowbtn{display:flex;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.qlist .rowbtn.on{background:var(--accent-soft)}
.phone{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--shadow)}
.ig-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ig-av{width:44px;height:44px;border-radius:50%;background:linear-gradient(165deg,hsl(var(--h) 62% 45%),hsl(var(--h) 70% 18%));flex:none}
.ig-h b{display:block;font-size:13px}
.ig-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.ig-grid .tile{border-radius:0;padding:5px}
.ig-grid .tile-t{font-size:7.5px}.ig-grid .tile-c{display:none}.ig-grid .tile-fmt{font-size:7px;top:4px;left:4px;padding:0 3px}
.ig-grid .tile.cur{outline:3px solid var(--accent);outline-offset:-3px}
.ig-grid .tile.ghost{opacity:.35}
.capprev{font-size:12.5px;margin-top:12px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:150px;overflow:auto;color:var(--ink)}
.notes{display:flex;flex-direction:column;gap:8px}
.note{border:1px solid var(--line);border-radius:10px;padding:9px 11px;display:flex;gap:10px;align-items:flex-start}
.note.cli{border-color:color-mix(in srgb,var(--bad) 35%,var(--line));background:var(--bad-soft)}
.note.done{opacity:.55}.note.done .nt{text-decoration:line-through}
.note .nt{flex:1;min-width:0;overflow-wrap:anywhere;font-size:13px}
.note small{display:block;color:var(--muted);font-size:11.5px}
.tabs{display:inline-flex;background:var(--surface);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.tabs button{border:0;background:none;border-radius:7px;padding:5px 12px;font-size:12.5px;font-weight:500;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* ---- portal do cliente ---- */
.portal{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.portal-h{background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:12px;padding:14px 18px;flex-wrap:wrap}
.portal-h .bm{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700}
.portal-h .who{margin-left:auto;font-size:12.5px;opacity:.8}
.portal-b{padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:16px}
.apcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.apcard .cap{font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:110px;overflow:auto}
.apcard .acts{display:flex;gap:8px;flex-wrap:wrap}
.apcard .acts .btn{flex:1;justify-content:center}
.sent{font-size:11.5px;color:var(--muted)}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:16px}
.notice b{color:var(--accent)}

/* ---- calendário ---- */
.cal-wrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(90px,1fr));min-width:660px;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .dh{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface)}
.cal .dc{min-height:96px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.cal .dc.out{background:var(--surface)}
.cal .dc .n{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.cal .dc.is-today .n{background:var(--accent);color:var(--accent-ink);border-radius:20px;width:24px;text-align:center}
.chip{display:flex;align-items:center;gap:5px;font-size:11px;border-radius:6px;padding:3px 6px;background:var(--accent-soft);border:0;text-align:left;min-width:0;width:100%}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chip.past{background:var(--surface);color:var(--muted)}
.chip .av{width:18px;height:18px;font-size:8px;flex:none}
.chip.k-prod{background:var(--surface);color:var(--ink)}
.chip.k-cliente{background:var(--warn-soft)}
.chip.k-ajuste{background:var(--bad-soft)}
.chip.k-aprovado{background:var(--ok-soft)}
.chip.k-agendado{background:var(--accent-soft)}
.chip.k-late{box-shadow:inset 3px 0 0 var(--bad)}
.chip:hover{filter:brightness(.96)}
.ptabs{display:flex;gap:4px;padding:0 18px;background:var(--ink);overflow-x:auto}
.ptabs button{border:0;background:none;color:color-mix(in srgb,var(--bg) 65%,var(--ink));padding:10px 12px;font-weight:500;font-size:13px;border-bottom:2px solid transparent;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.ptabs button.on{color:var(--bg);border-bottom-color:var(--accent)}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:20px;font-size:11px;padding:0 7px;font-family:var(--mono)}
.adjmeter{font-size:12.5px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:3px 12px}
.adjmeter.over{border-color:var(--bad);color:var(--bad)}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:12.5px}
.portal-empty{padding:40px 18px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.portal-pad{padding:14px 18px 18px;display:flex;flex-direction:column;gap:14px}
.stats.mets{margin-bottom:0}
.up{color:var(--ok);font-weight:600}.down{color:var(--bad);font-weight:600}
.vbars{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;height:180px;align-items:end}
.vb{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.vb i{display:block;width:100%;max-width:56px;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:4px}
.vb .mono{font-size:11px;color:var(--muted)}.vb small{font-size:11.5px;color:var(--muted)}
.tops{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:12px}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer}
.switch input{width:17px;height:17px;accent-color:var(--accent)}
.row.off{opacity:.55}
.mbar{display:flex;align-items:center;gap:8px}
.mbar i{display:block;height:10px;border-radius:3px;background:var(--ok)}.mbar i.neg{background:var(--bad)}
.mbar .mono{font-size:12px}
.tnum{width:72px;text-align:right;padding:4px 8px;display:inline-block}
.tbl tbody tr.nohover{cursor:default}.tbl tbody tr.nohover:hover{background:none}
.tbl.perm .c{text-align:center}.tbl.perm input{width:17px;height:17px;accent-color:var(--accent)}
.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tchip{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:2px 4px 2px 10px;font-size:12.5px;font-weight:500}
.tchip button{border:0;background:none;color:inherit;font-size:14px;line-height:1;padding:0 4px}
.palette{display:flex;gap:12px;flex-wrap:wrap}
.palette div{display:flex;flex-direction:column;gap:6px;font-size:11.5px}
.palette i{display:block;width:72px;height:52px;border-radius:8px;border:1px solid var(--line)}
.viewas{display:flex;flex-direction:column;gap:4px;width:100%}
.viewas label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--rail-muted)}
.aibar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn.ai{border-color:var(--accent);color:var(--accent)}
.clientbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.chip.k-crm{background:var(--card);box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent);font-weight:500}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:720px;font-size:13px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:10px 16px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr{cursor:pointer}.tbl tbody tr:hover{background:var(--surface)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.ls-reuniao,.ls-proposta{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.ls-negociacao{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.ls-ganho{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.ls-perdido{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.kcol.won{background:var(--ok-soft)}
.kcol.lost{background:var(--surface);opacity:.85}
.chip.k-meet{background:var(--ink);color:var(--bg)}
.chip.k-meet .mono{color:color-mix(in srgb,var(--bg) 75%,var(--ink))}
.dthumb{width:44px;aspect-ratio:4/5;border-radius:5px;flex:none;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.02em}
.dthumb.lg{width:120px;font-size:30px;border-radius:8px}
.cat{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--accent);letter-spacing:.03em}
.cal.big .dc{min-height:118px}
.whof{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

/* ================= helpers de UI ================= */
const dueLabel = p => {
  if (DONE.includes(p.stage)) return `<span class="mono">${ddmm(p.due)}</span>`;
  const d = diff(p.due);
  if (d < 0) return `<span class="late">Atrasado ${-d}d</span>`;
  if (d === 0) return `<span class="today">Hoje</span>`;
  return `<span class="mono">${ddmm(p.due)}</span>`;
};
const pill = st => `<span class="pill st-${st}">${stage(st).label}</span>`;
const av = id => { const t = person(id); return `<span class="av" title="${esc(t.name)}">${t.ini}</span>`; };
const tile = (p, cls='') => { const c = client(p.client); return `<div class="tile ${cls}" style="--h:${c.hue}"><span class="tile-fmt">${p.format}</span><span class="tile-t">${esc(p.title)}</span><span class="tile-c">${c.short}</span></div>`; };
const thumb = p => p.kind === 'demanda' ? `<span class="dthumb" title="${esc(p.cat)}">${catCode(p.cat)}</span>` : tile(p,'sm');
const sub = p => p.kind === 'demanda' ? `${esc(p.cat)} · ${esc(client(p.client).name)}` : `${esc(client(p.client).name)} · ${p.format}`;
const cdot = c => `<span class="dot" style="--h:${client(c).hue}"></span>`;
const clientOpts = (sel, all) => (all ? `<option value="all"${sel==='all'?' selected':''}>Todos os clientes</option>` : '') + S.clients.map(c => `<option value="${c.id}"${c.id===sel?' selected':''}>${esc(c.name)}</option>`).join('');
const isLate = p => !DONE.includes(p.stage) && p.stage !== 'cliente' && diff(p.due) < 0;
const head = (eyebrow, title, lede, right='') => `<div class="pagehead"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1>${lede?`<p class="lede">${lede}</p>`:''}</div>${right}</div>`;

let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200); }

function setStage(p, st){
  p.stage = st; if (p.kind !== 'demanda') p.owner = stage(st).owner;
  if (st === 'cliente') p.sentAt = iso(TODAY);
  if (st !== 'agendado') p.sched = null;
}

/* ================= views ================= */
function vInicio(){
  const late = S.posts.filter(isLate);
  const todayP = S.posts.filter(p => !DONE.includes(p.stage) && p.stage !== 'cliente' && diff(p.due) === 0);
  const waiting = S.posts.filter(p => p.stage === 'cliente').sort((a,b) => a.sentAt.localeCompare(b.sentAt));
  const next = S.posts.filter(p => p.stage === 'agendado' && p.sched && diff(p.sched) >= 0).sort((a,b) => a.sched.localeCompare(b.sched)).slice(0,5);
  const adj = S.posts.filter(p => p.stage === 'ajuste').length;
  const d = TODAY;
  const row = p => `<button class="row rowbtn" data-act="open" data-id="${p.id}">${thumb(p)}<div class="grow"><div class="t">${esc(p.title)}</div><div class="s">${sub(p)} · ${stage(p.stage).label}</div></div>${av(p.owner)}${dueLabel(p)}</button>`;
  const tabs = `<div class="tabs" role="tablist" style="margin-bottom:18px"><button class="${S.ui.itab==='cal'?'on':''}" data-act="itab" data-t="cal">Calendário do mês</button><button class="${S.ui.itab==='resumo'?'on':''}" data-act="itab" data-t="resumo">Resumo do dia</button></div>`;
  const top = head(`${DIAS_LONGO[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]}`, `Bom dia, ${esc(person(S.me).name)}`, S.ui.itab==='cal' ? 'Todas as demandas do mês e quem está com cada uma.' : 'Resumo da operação da agência hoje.', `<span class="demo">Dados de exemplo</span>`) + tabs;
  if (S.ui.itab === 'cal') return top + vMes();
  return top +
  `<div class="stats">
    <div class="stat hl"><b>${S.posts.filter(p=>!DONE.includes(p.stage)).length}</b><span>tarefas em aberto</span></div>
    <div class="stat ${late.length?'alert':''}"><b>${late.length}</b><span>atrasados</span></div>
    <div class="stat"><b>${waiting.length}</b><span>esperando o cliente</span></div>
    <div class="stat"><b>${adj}</b><span>ajustes pedidos</span></div>
  </div>
  <div class="grid2">
    <section class="panel"><div class="panel-h"><h3>Precisa de atenção hoje</h3><button class="btn sm ghost" data-act="go" data-v="pauta">Abrir pauta</button></div>
      <div class="list">${[...late, ...todayP].map(row).join('') || '<div class="empty">Nada atrasado nem vencendo hoje.</div>'}</div></section>
    <section class="panel"><div class="panel-h"><h3>Esperando o cliente</h3><button class="btn sm ghost" data-act="go" data-v="aprovacao">Ver portal</button></div>
      <div class="list">${waiting.map(p => { const w = -diff(p.sentAt); return `<button class="row rowbtn" data-act="open" data-id="${p.id}">${tile(p,'sm')}<div class="grow"><div class="t">${esc(p.title)}</div><div class="s">${esc(client(p.client).name)}</div></div><span class="${w>=2?'late':'muted'}" style="font-size:12px">${w===0?'enviado hoje':`há ${w} dia${w>1?'s':''}`}</span></button>`; }).join('') || '<div class="empty">Nenhum conteúdo com o cliente.</div>'}</div></section>
    <section class="panel"><div class="panel-h"><h3>Próximas publicações</h3><button class="btn sm ghost" data-act="go" data-v="agendamento">Calendário</button></div>
      <div class="list">${next.map(p => `<button class="row rowbtn" data-act="open" data-id="${p.id}">${tile(p,'sm')}<div class="grow"><div class="t">${esc(p.title)}</div><div class="s">${esc(client(p.client).name)}</div></div><span class="mono" style="font-size:12px">${ddmm(p.sched)} ${p.sched.slice(11)}</span></button>`).join('') || '<div class="empty">Nada agendado.</div>'}</div></section>
    <section class="panel"><div class="panel-h"><h3>Reuniões</h3><button class="btn sm ghost" data-act="go" data-v="reunioes">Agenda</button></div>
      <div class="list">${S.meetings.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,4).map(m => `<div class="row"><div class="grow"><div class="t">${esc(m.title)}</div><div class="s">${esc(m.client)} · ${esc(m.who)}</div></div><span class="mono" style="font-size:12px">${ddmm(m.date)} ${m.time}</span></div>`).join('')}</div></section>
  </div>`;
}

function vMes(){
  const { y, m } = S.ui.ical, fo = S.ui.ifo;
  const key = p => p.sched ? p.sched.slice(0,10) : p.due;
  const ym = y+'-'+String(m+1).padStart(2,'0');
  const monthAll = S.posts.filter(p => key(p).startsWith(ym));
  const month = monthAll.filter(p => fo === 'all' || p.owner === fo);
  const first = new Date(y, m, 1), startDow = first.getDay();
  const cells = [];
  for (let i = 0; i < 42; i++){ const d = new Date(y, m, 1 - startDow + i); if (i >= 35 && d.getMonth() !== m) break; cells.push(d); }
  const kind = p => p.stage === 'feito' ? 'aprovado' : (p.stage === 'cliente' || p.stage === 'ajuste' || DONE.includes(p.stage) ? p.stage : 'prod');
  const lateN = month.filter(isLate).length;
  const meets = S.meetings.filter(mt => mt.date.startsWith(ym) && (fo === 'all' || mt.who.includes(person(fo).name)));
  const fups = S.leads.filter(l => leadOpen(l) && l.next && l.next.date.startsWith(ym) && (fo === 'all' || l.owner === fo));
  return `<div class="whof">
      <button class="all ${fo==='all'?'on':''}" data-act="ifo" data-o="all">Todo o time · ${monthAll.length}</button>
      ${S.team.map(t => `<button class="${fo===t.id?'on':''}" data-act="ifo" data-o="${t.id}">${av(t.id)}${t.name} · ${monthAll.filter(p=>p.owner===t.id).length}</button>`).join('')}
    </div>
    <section class="panel">
      <div class="panel-h"><div><h3 style="text-transform:capitalize">${MESES[m]} ${y}</h3><div class="muted" style="font-size:12.5px;margin-top:2px">${month.length} demanda${month.length===1?'':'s'} e ${meets.length} ${meets.length===1?'reunião':'reuniões'}${fo!=='all'?` com ${person(fo).name}`:''}${lateN?` · <span class="late">${lateN} atrasada${lateN>1?'s':''}</span>`:''}</div></div>
        <div style="display:flex;gap:6px"><button class="btn sm" data-act="iprev" aria-label="Mês anterior">‹</button><button class="btn sm" data-act="itoday">Hoje</button><button class="btn sm" data-act="inext" aria-label="Próximo mês">›</button></div></div>
      <div class="cal-wrap"><div class="cal big">${DIAS.map(d => `<div class="dh">${d}</div>`).join('')}
        ${cells.map(d => { const k = iso(d); const ps = month.filter(p => key(p) === k);
          const ms = meets.filter(mt => mt.date === k).sort((a,b)=>a.time.localeCompare(b.time));
          const fs = fups.filter(l => l.next.date === k);
          return `<div class="dc ${d.getMonth()!==m?'out':''} ${k===iso(TODAY)?'is-today':''}"><span class="n">${d.getDate()}</span>${ms.map(mt => `<button class="chip k-meet" data-act="go" data-v="reunioes" title="Reunião · ${esc(mt.client)} · ${esc(mt.title)} · ${mt.time} · ${esc(mt.who)}"><span class="mono">${mt.time}</span><span>${esc(mt.client)} · ${esc(mt.title)}</span></button>`).join('')}${fs.map(l => `<button class="chip k-crm ${diff(k)<0?'k-late':''}" data-act="openlead" data-id="${l.id}" title="CRM · ${esc(l.empresa)} · ${esc(l.next.text)} · com ${person(l.owner).name}">${av(l.owner)}<span>CRM · ${esc(l.empresa)}</span></button>`).join('')}${ps.map(p => `<button class="chip k-${kind(p)} ${isLate(p)?'k-late':''}" data-act="open" data-id="${p.id}" title="${esc(client(p.client).name)} · ${esc(p.title)} · ${stage(p.stage).label} · com ${person(p.owner).name}">${av(p.owner)}<span>${esc(client(p.client).short)} · ${esc(p.title)}</span></button>`).join('')}</div>`; }).join('')}
      </div></div>
      <div class="legend"><span><i style="background:var(--surface);border:1px solid var(--line)"></i>Em produção</span><span><i style="background:var(--warn-soft)"></i>Com o cliente</span><span><i style="background:var(--bad-soft)"></i>Ajuste</span><span><i style="background:var(--ok-soft)"></i>Aprovado</span><span><i style="background:var(--accent-soft)"></i>Agendado</span><span><i style="background:var(--bad)"></i>Atrasado</span><span><i style="background:var(--ink)"></i>Reunião</span><span><i style="background:var(--card);box-shadow:inset 0 0 0 1px var(--accent)"></i>Follow-up do CRM</span><span>As iniciais mostram quem está com a demanda</span></div>
    </section>`;
}

function vPauta(){
  const { fc, fo, ptab } = S.ui;
  const isD = ptab === 'demanda', SL = isD ? DSTAGES : STAGES, kindKey = isD ? 'demanda' : 'conteudo';
  const list = S.posts.filter(p => p.kind === kindKey && (fc === 'all' || p.client === fc) && (fo === 'all' || p.owner === fo));
  const nC = S.posts.filter(p => p.kind === 'conteudo' && !DONE.includes(p.stage)).length, nD = S.posts.filter(p => p.kind === 'demanda' && !DONE.includes(p.stage)).length;
  return head('Operação', 'Tarefas', isD ? 'Tudo o que a agência precisa fazer além do conteúdo: tráfego, comercial, financeiro, branding, atendimento.' : 'Arraste os cards entre as etapas ou use a seta para avançar. Cada etapa passa o conteúdo para o responsável certo.',
    `<button class="btn pri" data-act="newpost">${isD ? '+ Nova demanda' : '+ Nova pauta'}</button>`) +
  `<div class="tabs" role="tablist" style="margin-bottom:16px"><button class="${ptab==='conteudo'?'on':''}" data-act="ptab" data-t="conteudo">Conteúdos · ${nC}</button><button class="${isD?'on':''}" data-act="ptab" data-t="demanda">Demandas da agência · ${nD}</button><button class="${ptab==='recorrentes'?'on':''}" data-act="ptab" data-t="recorrentes">Recorrentes · ${S.recur.filter(r=>r.on).length}</button></div>
  ${ptab === 'recorrentes' ? recurPanel() : `<div class="filters">
    <div class="field"><label for="fc">Cliente</label><select class="inp" id="fc" data-bind="fc">${clientOpts(fc,true)}${isD?`<option value="int"${fc==='int'?' selected':''}>O.BRAND (interno)</option>`:''}</select></div>
    <div class="field"><label for="fo">Responsável</label><select class="inp" id="fo" data-bind="fo"><option value="all">Todo o time</option>${S.team.map(t=>`<option value="${t.id}"${t.id===fo?' selected':''}>${t.name}</option>`).join('')}</select></div>
    <span class="demo" style="margin-left:auto">${list.length} ${isD?'demandas':'conteúdos'}</span>
  </div>
  <div class="board-wrap"><div class="board">${SL.map((s,i) => {
    const items = list.filter(p => p.stage === s.id);
    return `<div class="kcol" data-drop="${s.id}"><div class="kcol-h"><span>${s.label}</span><span class="mono">${items.length}</span></div>
      ${items.map(p => `<div class="kcard" draggable="true" data-drag="${p.id}" data-act="open" data-id="${p.id}" tabindex="0" role="button" aria-label="${esc(p.title)}">
        ${isD ? `<div class="ct"><span class="cat">${esc(p.cat)}</span></div><div class="ct">${cdot(p.client)}${esc(client(p.client).name)}</div>` : `<div class="ct">${cdot(p.client)}${esc(client(p.client).name)} · ${p.format}</div>`}
        <div class="tt">${esc(p.title)}</div>
        <div class="ft">${av(p.owner)}${dueLabel(p)}${p.clientAdj?`<span class="adjmark" title="Ajustes pedidos pelo cliente">↺${p.clientAdj}</span>`:''}<span class="sp"></span>${i < SL.length-1 ? (lbl => `<button class="adv" data-act="adv" data-id="${p.id}" title="Mover para ${lbl}" aria-label="Mover para ${lbl}">›</button>`)(s.id === 'ajuste' ? 'Revisão interna' : SL[i+1].label) : ''}</div>
      </div>`).join('')}
    </div>`; }).join('')}</div></div>`}`;
}

function vCriacao(){
  const cc = S.ui.cc, c = client(cc);
  const prod = S.posts.filter(p => p.kind === 'conteudo' && p.client === cc && !DONE.includes(p.stage));
  if (!prod.find(p => p.id === S.ui.cp)) S.ui.cp = prod[0]?.id || null;
  const p = S.posts.find(x => x.id === S.ui.cp);
  const feed = S.posts.filter(x => x.kind === 'conteudo' && x.client === cc && DONE.includes(x.stage)).sort((a,b) => (b.sched||b.due).localeCompare(a.sched||a.due));
  const tab = S.ui.ctab;
  const internal = p ? p.notes.filter(n => n.type === 'int') : [], ext = p ? p.notes.filter(n => n.type === 'cli') : [];
  const notesHtml = arr => arr.length ? arr.map(n => { const i = p.notes.indexOf(n); return `<div class="note ${n.type==='cli'?'cli':''} ${n.done?'done':''}"><input type="checkbox" id="nd-${p.id}-${i}" data-act="notedone" data-id="${p.id}" data-i="${i}" ${n.done?'checked':''} aria-label="Marcar como resolvido"><div class="nt">${esc(n.text)}<small>${esc(n.who)}</small></div></div>`; }).join('') : '<div class="muted" style="font-size:13px">Nenhum por aqui.</div>';
  return head('Operação', 'Criação', 'Escreva a legenda e veja como o post fica no feed do cliente enquanto produz.') +
  `<div class="filters"><div class="field"><label for="cc">Cliente</label><select class="inp" id="cc" data-bind="cc">${clientOpts(cc)}</select></div></div>
  <div class="cria">
    <section class="panel qlist"><div class="panel-h"><h3>Em produção</h3><span class="mono muted">${prod.length}</span></div>
      ${prod.map(x => `<button class="rowbtn ${x.id===S.ui.cp?'on':''}" data-act="pick" data-id="${x.id}">${tile(x,'sm')}<div style="min-width:0"><div style="font-size:12.5px;font-weight:600;overflow-wrap:anywhere">${esc(x.title)}</div>${pill(x.stage)}</div></button>`).join('') || '<div class="empty">Nada em produção para este cliente.</div>'}
    </section>
    <section class="panel">${p ? `
      <div class="panel-h"><div style="min-width:0"><h3 style="overflow-wrap:anywhere">${esc(p.title)}</h3><div class="muted" style="font-size:12.5px;margin-top:2px">${p.format} · ${stage(p.stage).label} · ${person(p.owner).name}</div></div>
        <button class="btn sm" data-act="adv" data-id="${p.id}">Avançar etapa ›</button></div>
      <div class="panel-b" style="display:flex;flex-direction:column;gap:14px">
        <div class="tabs" role="tablist">
          <button class="${tab==='legenda'?'on':''}" data-act="ctab" data-t="legenda">Legenda</button>
          <button class="${tab==='int'?'on':''}" data-act="ctab" data-t="int">Ajustes internos (${internal.filter(n=>!n.done).length})</button>

function vAgendamento(){
  const { y, m } = S.ui.cal;
  const ready = S.posts.filter(p => p.stage === 'aprovado');
  const first = new Date(y, m, 1), startDow = first.getDay(), days = new Date(y, m+1, 0).getDate();
  const cells = [];
  for (let i = 0; i < 42; i++){
    const d = new Date(y, m, 1 - startDow + i);
    if (i >= 35 && d.getMonth() !== m) break;
    cells.push(d);
  }
  const tomorrow = addDays(1);
  return head('Clientes', 'Agendamento', 'Conteúdos aprovados entram aqui para ganhar data e hora.') +
  `<div class="notice"><b>Fase 3</b><span>No protótipo o agendamento só organiza o calendário. Na versão final, o post é publicado sozinho no Instagram e Facebook pela API da Meta.</span></div>
  <section class="panel" style="margin-bottom:16px"><div class="panel-h"><h3>Aprovados, prontos para agendar</h3><span class="mono muted">${ready.length}</span></div>
    <div>${ready.map(p => `<div class="sched-row">${tile(p,'sm')}<div class="grow"><div style="font-weight:500;overflow-wrap:anywhere">${esc(p.title)}</div><div class="muted" style="font-size:12.5px">${esc(client(p.client).name)} · ${p.format}</div></div>
      <input class="inp" type="date" id="sd-${p.id}" value="${p.due < tomorrow ? tomorrow : p.due}" aria-label="Data"><input class="inp" type="time" id="st-${p.id}" value="18:00" aria-label="Hora"><button class="btn pri sm" data-act="schedule" data-id="${p.id}">Agendar</button></div>`).join('') || '<div class="empty">Nenhum conteúdo aprovado esperando data.</div>'}</div>
  </section>
  <section class="panel">
    <div class="panel-h"><h3 style="text-transform:capitalize">${MESES[m]} ${y}</h3><div style="display:flex;gap:6px"><button class="btn sm" data-act="calprev" aria-label="Mês anterior">‹</button><button class="btn sm" data-act="caltoday">Hoje</button><button class="btn sm" data-act="calnext" aria-label="Próximo mês">›</button></div></div>
    <div class="cal-wrap"><div class="cal">${DIAS.map(d => `<div class="dh">${d}</div>`).join('')}
      ${cells.map(d => { const k = iso(d); const ps = S.posts.filter(p => p.sched && p.sched.startsWith(k)).sort((a,b)=>a.sched.localeCompare(b.sched));
        return `<div class="dc ${d.getMonth()!==m?'out':''} ${k===iso(TODAY)?'is-today':''}"><span class="n">${d.getDate()}</span>${ps.map(p => `<button class="chip ${diff(k)<0?'past':''}" data-act="open" data-id="${p.id}" title="${esc(client(p.client).name)}: ${esc(p.title)}">${cdot(p.client)}<span class="mono">${p.sched.slice(11)}</span><span>${esc(p.title)}</span></button>`).join('')}</div>`; }).join('')}
    </div></div>
  </section>`;
}

/* ================= métricas de exemplo ================= */
function mets(cid){
  const c = client(cid), s = c.hue + 37;
  const alcance = 14000 + s * 97;
  const w = [0.22, 0.24, 0.25, 0.29].map((f, i) => Math.round(alcance * f * (1 + ((s * (i+3)) % 9 - 4) / 60)));
  const invest = 600 + (s % 5) * 150, res = 38 + (s % 31);
  return {
    seguidores: 2100 + s * 19, novos: 70 + (s % 50) * 3, novosAnt: 60 + (s % 40) * 3,
    alcance, alcanceAnt: Math.round(alcance * (0.86 + (s % 7) / 100)), engaj: (3.2 + (s % 17) / 10).toFixed(1).replace('.', ','),
    visitas: 850 + s * 5, cliques: 110 + s % 90, semanas: w,
    invest, res, cpr: (invest / res).toFixed(2).replace('.', ','), resLabel: ['c4','c5','c6'].includes(cid) ? 'conversas no WhatsApp' : cid === 'c3' ? 'compras no site' : 'agendamentos',
  };
}
const nf = n => Number(n).toLocaleString('pt-BR');
const pct = (a, b) => { const d = Math.round((a - b) / b * 100); return `<span class="${d >= 0 ? 'up' : 'down'}">${d >= 0 ? '+' : ''}${d}%</span>`; };

/* ================= portal do cliente (3 abas) ================= */
function portal(cid){
  const c = client(cid), k = ct(cid), tab = S.ui.ptb || 'aprovar';
  const items = S.posts.filter(p => p.kind === 'conteudo' && p.client === cid && p.stage === 'cliente');
  const used = adjUsed(cid), lim = k ? k.ajustesMes : 0;
  const tabs = `<div class="ptabs" role="tablist">
    <button class="${tab==='aprovar'?'on':''}" data-act="ptb" data-t="aprovar">Aprovar conteúdos${items.length?` <span class="badge">${items.length}</span>`:''}</button>
    <button class="${tab==='metricas'?'on':''}" data-act="ptb" data-t="metricas">Relatório de métricas</button>
    <button class="${tab==='entregas'?'on':''}" data-act="ptb" data-t="entregas">Relatório de entregas</button></div>`;
  let body = '';
  if (tab === 'aprovar'){
    const recent = S.posts.filter(p => p.kind === 'conteudo' && p.client === cid && (p.stage === 'aprovado' || p.stage === 'ajuste'));
    body = `<div style="padding:18px 18px 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center"><h2 style="font-size:20px">${items.length ? `${items.length} conteúdo${items.length>1?'s':''} para você aprovar` : 'Tudo aprovado por aqui'}</h2>
      ${k ? `<span class="adjmeter ${used>=lim?'over':''}">Ajustes do mês: <b class="mono">${used} de ${lim}</b></span>` : ''}</div>
    <div class="portal-b">${items.map(p => `<article class="apcard">${tile(p)}
        <div><b style="font-size:13px">${esc(p.title)}</b><div class="sent">${p.format} · prevista para ${ddmm(p.due)}</div></div>
        <div class="cap">${esc(p.caption)}</div>
        ${S.ui.adj === p.id ? `${k && used >= lim ? `<div class="warnbox">Você já usou os ${lim} ajustes do mês previstos no contrato. Este pedido pode ser cobrado à parte.</div>` : ''}<div class="field"><label for="adj-${p.id}">O que precisa mudar?</label><textarea class="inp" id="adj-${p.id}" rows="3" style="min-height:80px" placeholder="Descreva o ajuste"></textarea></div>
          <div class="acts"><button class="btn" data-act="adjcancel">Cancelar</button><button class="btn dark" data-act="adjsend" data-id="${p.id}">Enviar pedido</button></div>`
        : `<div class="acts"><button class="btn" data-act="adjopen" data-id="${p.id}">Pedir ajuste</button><button class="btn pri" data-act="approve" data-id="${p.id}">Aprovar</button></div>`}
      </article>`).join('') || `<div class="muted">Quando a agência enviar novos conteúdos, eles aparecem aqui.</div>`}
    </div>
    ${recent.length ? `<div style="padding:0 18px 18px"><div class="flabel" style="margin-bottom:8px">Histórico recente</div><div class="panel list">${recent.map(p => `<div class="row">${tile(p,'sm')}<div class="grow"><div class="t">${esc(p.title)}</div></div>${p.stage==='ajuste'?'<span class="pill st-ajuste">Em ajuste</span>':'<span class="pill st-aprovado">Aprovado</span>'}</div>`).join('')}</div></div>` : ''}`;
  } else if (tab === 'metricas'){
    if (!S.reports[cid]) body = `<div class="portal-empty"><h2 style="font-size:20px">Relatório de setembro em preparação</h2><p class="muted">A agência está revisando os números. Você recebe um aviso quando ele estiver disponível.</p></div>`;
    else {
      const m = mets(cid), maxW = Math.max(...m.semanas);
      const top = S.posts.filter(p => p.kind === 'conteudo' && p.client === cid && p.stage === 'agendado' && p.sched && diff(p.sched) < 0).slice(0, 3);
      body = `<div style="padding:18px 18px 4px"><div class="eyebrow">Relatório mensal · revisado pela agência</div><h2 style="font-size:22px">Setembro de 2026</h2></div>
      <div class="portal-pad">
        <div class="flabel">Instagram @${esc(c.handle)}</div>
        <div class="stats mets">
          <div class="stat"><b>${nf(m.alcance)}</b><span>contas alcançadas ${pct(m.alcance, m.alcanceAnt)}</span></div>
          <div class="stat"><b>+${nf(m.novos)}</b><span>novos seguidores ${pct(m.novos, m.novosAnt)}</span></div>
          <div class="stat"><b>${m.engaj}%</b><span>taxa de engajamento</span></div>
          <div class="stat"><b>${nf(m.visitas)}</b><span>visitas ao perfil · ${nf(m.cliques)} cliques no link</span></div>
        </div>
        <div class="grid2">
          <section class="panel"><div class="panel-h"><h3>Alcance por semana</h3><span class="muted" style="font-size:12px">contas alcançadas</span></div>
            <div class="panel-b"><div class="vbars">${m.semanas.map((v,i) => `<div class="vb"><span class="mono">${nf(v)}</span><i style="height:${Math.round(v/maxW*100)}%"></i><small>Sem. ${i+1}</small></div>`).join('')}</div></div></section>
          <section class="panel"><div class="panel-h"><h3>Tráfego pago</h3><span class="muted" style="font-size:12px">Meta Ads</span></div>
            <div class="list"><div class="row"><div class="grow">Investimento</div><b class="mono">${brl(m.invest)}</b></div><div class="row"><div class="grow">Resultados (${m.resLabel})</div><b class="mono">${m.res}</b></div><div class="row"><div class="grow">Custo por resultado</div><b class="mono">R$ ${m.cpr}</b></div></div></section>
        </div>
        ${top.length ? `<div class="flabel" style="margin-top:6px">Destaques do mês</div><div class="tops">${top.map((p,i) => `<div class="topcard">${tile(p)}<div class="mono" style="font-size:12px;margin-top:6px">${nf(Math.round(m.alcance*(0.18-i*0.04)))} contas alcançadas</div></div>`).join('')}</div>` : ''}
        <div class="notice" style="margin:4px 0 0"><b>Leitura da agência</b><span>O alcance cresceu na segunda metade do mês, puxado pelos Reels. Para outubro, a recomendação é manter dois Reels por semana e testar um novo público na campanha.</span></div>
      </div>`;
    }
  } else {
    const ym = iso(TODAY).slice(0,7);
    const mine = S.posts.filter(p => p.kind === 'conteudo' && p.client === cid && ((p.sched || p.due).startsWith(ym)));
    const entregues = mine.filter(p => p.stage === 'agendado').length, meta = k ? k.postsMes : mine.length;
    const st = p => p.stage === 'agendado' ? (diff(p.sched) < 0 ? ['Publicado','st-aprovado'] : ['Agendado','st-agendado']) : p.stage === 'aprovado' ? ['Aprovado','st-aprovado'] : p.stage === 'cliente' ? ['Aguardando você','st-cliente'] : p.stage === 'ajuste' ? ['Em ajuste','st-ajuste'] : ['Em produção',''];
    const dem = S.posts.filter(p => p.kind === 'demanda' && p.client === cid);
    const meets = S.meetings.filter(mt => mt.client === c.name);
    body = `<div style="padding:18px 18px 4px"><div class="eyebrow">Atualizado em tempo real</div><h2 style="font-size:22px">Entregas de ${MESES[TODAY.getMonth()]}</h2></div>
    <div class="portal-pad">
      <div class="stats mets">
        <div class="stat hl"><b>${entregues} de ${meta}</b><span>conteúdos publicados ou agendados</span><div class="prog" style="margin-top:8px;background:rgba(255,255,255,.18)"><i style="width:${Math.min(100, Math.round(entregues/Math.max(1,meta)*100))}%"></i></div></div>
        <div class="stat"><b>${mine.filter(p => !DONE.includes(p.stage)).length}</b><span>em produção ou aprovação</span></div>
        <div class="stat"><b>${used} de ${lim}</b><span>ajustes usados no mês</span></div>
        <div class="stat"><b>${meets.length}</b><span>reuniões no mês</span></div>
      </div>
      <section class="panel"><div class="panel-h"><h3>Conteúdos</h3><span class="mono muted">${mine.length}</span></div>
        <div class="list">${mine.sort((a,b)=>(a.sched||a.due).localeCompare(b.sched||b.due)).map(p => { const [l, cls] = st(p); return `<div class="row">${tile(p,'sm')}<div class="grow"><div class="t">${esc(p.title)}</div><div class="s">${p.format} · ${ddmm(p.sched || p.due)}</div></div><span class="pill ${cls}">${l}</span></div>`; }).join('') || '<div class="empty">Nenhum conteúdo neste mês.</div>'}</div></section>
      ${dem.length ? `<section class="panel"><div class="panel-h"><h3>Outros serviços</h3></div><div class="list">${dem.map(p => `<div class="row"><span class="dthumb">${catCode(p.cat)}</span><div class="grow"><div class="t">${esc(p.title)}</div><div class="s">${esc(p.cat)}</div></div><span class="pill ${p.stage==='feito'?'st-aprovado':''}">${p.stage==='feito'?'Concluído':'Em andamento'}</span></div>`).join('')}</div></section>` : ''}
      ${meets.length ? `<section class="panel"><div class="panel-h"><h3>Reuniões</h3></div><div class="list">${meets.map(mt => `<div class="row"><div class="grow"><div class="t">${esc(mt.title)}</div></div><span class="mono" style="font-size:12.5px">${ddmm(mt.date)} ${mt.time}</span></div>`).join('')}</div></section>` : ''}
    </div>`;
  }
  return `<div class="portal">
    <div class="portal-h"><span class="bm">${esc(S.brand.name[0]||'B')}</span><b>${esc(S.brand.name)}</b><span class="who">${esc(c.name)}</span></div>
    ${tabs}${body}</div>`;
}

        <div class="field" style="width:150px"><label for="rdias">Lembrar após</label><select class="inp" id="rdias" data-rm="dias">${[1,2,3,4,5].map(d=>`<option value="${d}"${d===r.dias?' selected':''}>${d} dia${d>1?'s':''}</option>`).join('')}</select></div>

      <div class="list">${S.clients.map(c => `<div class="row">${cdot(c.id)}<div class="grow t">${esc(c.name)}</div><span class="pill ${S.reports[c.id]?'st-aprovado':'st-cliente'}">${S.reports[c.id]?'Publicado':'Em revisão'}</span><button class="btn sm" data-act="repub" data-c="${c.id}">${S.reports[c.id]?'Despublicar':'Publicar'}</button></div>`).join('')}</div>

/* ================= financeiro ================= */
function vFinanceiro(){
  const tab = S.ui.ftab || 'mensal';
  const cs = S.clients.filter(c => ct(c.id));
  const mrr = cs.reduce((a,c) => a + ct(c.id).valor, 0);
  const rec = cs.filter(c => payStatus(c.id) === 'pago').reduce((a,c) => a + ct(c.id).valor, 0);
  const late = cs.filter(c => payStatus(c.id) === 'atrasado');
  const renew = cs.filter(c => diff(ct(c.id).fim) <= 30);
  const T = (h, rows) => `<section class="panel"><div class="tbl-wrap"><table class="tbl"><thead><tr>${h}</tr></thead><tbody>${rows}</tbody></table></div></section>`;
  let body = '';
  if (tab === 'mensal') body = T('<th>Cliente</th><th class="num">Mensalidade</th><th>Vencimento</th><th>Status</th><th></th>',
    cs.map(c => { const s = payStatus(c.id), k = ct(c.id); return `<tr class="nohover"><td><span style="display:inline-flex;gap:8px;align-items:center">${cdot(c.id)}<b>${esc(c.name)}</b></span></td><td class="num mono">${brl(k.valor)}</td><td class="mono">dia ${k.dia}</td><td><span class="pill ${s==='pago'?'st-aprovado':s==='atrasado'?'st-ajuste':''}">${PAYLBL[s]}</span></td><td style="text-align:right">${k.pago ? `<button class="btn sm ghost" data-act="pay" data-c="${c.id}">Desfazer</button>` : `<button class="btn sm pri" data-act="pay" data-c="${c.id}">Marcar como pago</button>`}</td></tr>`; }).join(''));
  else if (tab === 'contratos') body = T('<th>Cliente</th><th>Vigência</th><th>Renovação</th><th class="num">Posts/mês</th><th class="num">Ajustes/mês</th>',
    cs.map(c => { const k = ct(c.id), d = diff(k.fim), u = adjUsed(c.id); return `<tr class="nohover"><td><span style="display:inline-flex;gap:8px;align-items:center">${cdot(c.id)}<b>${esc(c.name)}</b></span></td><td class="mono" style="font-size:12.5px">${k.inicio.split('-').reverse().join('/')} a ${k.fim.split('-').reverse().join('/')}</td><td>${d <= 30 ? `<span class="late">em ${d} dias</span>` : `<span class="muted">em ${Math.round(d/30)} meses</span>`}</td>
      <td class="num"><input class="inp mono tnum" type="number" min="1" id="cp-${c.id}" data-cf="postsMes" data-c="${c.id}" value="${k.postsMes}" aria-label="Posts por mês"></td>
      <td class="num"><span class="${u>k.ajustesMes?'late':'muted'} mono" style="font-size:12px;margin-right:6px">${u} usados</span><input class="inp mono tnum" type="number" min="0" id="ca-${c.id}" data-cf="ajustesMes" data-c="${c.id}" value="${k.ajustesMes}" aria-label="Limite de ajustes"></td></tr>`; }).join(''));
  else {
    const rows = cs.map(c => { const k = ct(c.id), h = hoursOf(c.id), custo = h * S.custoHora, m = k.valor - custo; return { c, k, h, custo, m, p: Math.round(m / k.valor * 100) }; }).sort((a,b) => a.p - b.p);
    body = `<div class="filters"><div class="field" style="width:200px"><label for="chora">Custo da hora do time (R$)</label><input class="inp mono" type="number" min="1" id="chora" data-cfg="custoHora" value="${S.custoHora}"></div><span class="muted" style="font-size:12.5px;align-self:center;max-width:52ch">As horas vêm do contrato e do que o time registra em cada tarefa.</span></div>` +
    T('<th>Cliente</th><th class="num">Mensalidade</th><th class="num">Horas no mês</th><th class="num">Custo</th><th class="num">Margem</th><th style="width:28%">Margem %</th>',
      rows.map(r => `<tr class="nohover"><td><span style="display:inline-flex;gap:8px;align-items:center">${cdot(r.c.id)}<b>${esc(r.c.name)}</b></span></td><td class="num mono">${brl(r.k.valor)}</td><td class="num mono">${nf(r.h)}h</td><td class="num mono">${brl(r.custo)}</td><td class="num mono ${r.m<0?'late':''}">${r.m<0?'−':''}${brl(Math.abs(r.m))}</td>
        <td><div class="mbar"><i class="${r.m<0?'neg':''}" style="width:${Math.max(3, Math.min(100, Math.abs(r.p)))}%"></i><span class="mono">${r.p}%</span></div></td></tr>`).join(''));
  }
  return head('Gestão', 'Financeiro', 'Mensalidades, contratos e quanto cada cliente realmente deixa de margem.') +
  `<div class="stats">
    <div class="stat hl"><b>${brl(mrr)}</b><span>receita mensal recorrente · ${cs.length} contratos</span></div>
    <div class="stat"><b>${brl(rec)}</b><span>recebido em ${MESES[TODAY.getMonth()]}</span></div>
    <div class="stat"><b>${brl(mrr - rec)}</b><span>a receber</span></div>
    <div class="stat ${late.length?'alert':''}"><b>${late.length}</b><span>pagamento${late.length===1?'':'s'} em atraso</span></div>
  </div>
  ${renew.length ? `<div class="notice"><b>Renovação</b><span>${renew.map(c => `${esc(c.name)} vence em ${diff(ct(c.id).fim)} dias`).join(' · ')}. Vale marcar a conversa de renovação.</span></div>` : ''}
  <div class="tabs" role="tablist" style="margin-bottom:16px"><button class="${tab==='mensal'?'on':''}" data-act="ftab" data-t="mensal">Mensalidades</button><button class="${tab==='contratos'?'on':''}" data-act="ftab" data-t="contratos">Contratos</button><button class="${tab==='rent'?'on':''}" data-act="ftab" data-t="rent">Rentabilidade</button></div>
  ${body}`;
}

/* ================= central do cliente ================= */

  `<div class="filters"><div class="field"><label for="hc">Cliente</label><select class="inp" id="hc" data-bind="hc">${clientOpts(cid)}</select></div><span class="demo" style="align-self:center">Conteúdo de exemplo</span></div>

function genRecur(){
  const nm = new Date(TODAY.getFullYear(), TODAY.getMonth()+1, 1), y = nm.getFullYear(), m = nm.getMonth(), key = iso(nm).slice(0,7);
  let n = 0; const last = new Date(y, m+1, 0).getDate();
  const mk = (r, d) => { const dt = new Date(y, m, d); const p = D(r.client, r.title, r.cat, 'afazer', r.owner, 0, 'Criada pela regra recorrente.'); p.due = iso(dt); n++; };
  S.recur.filter(r => r.on).forEach(r => {
    if (r.freq === 'Mensal') mk(r, Math.min(r.dia, last));
    else for (let d = 1; d <= last; d++) if (new Date(y, m, d).getDay() === r.dia) mk(r, d);
  });
  S.recGen[key] = true;
  return n;
}

let sampleFn = null;

async function aiCaption(p, btn){
  const c = client(p.client), b = S.briefs[p.client] || {};
  const status = document.getElementById('aistatus');
  const ta = document.getElementById('cap');
  const prompt = `Você escreve legendas de Instagram para a marca ${c.name}.
Sobre a marca: ${b.negocio || ''}
Público: ${b.publico || ''}
Objetivo: ${b.objetivo || ''}
Tom de voz: ${(b.tom || []).join(', ')}
Evitar: ${b.evitar || ''}

Escreva uma legenda em português do Brasil para um post no formato ${p.format} com o tema "${p.title}".
Regras: até 600 caracteres, frases curtas, uma chamada para ação no final, no máximo 3 hashtags. Não use travessão. Responda só com a legenda.`;
  const setCap = text => { p.caption = text; if (ta) ta.value = text; const pv = document.getElementById('capprev'); if (pv) pv.innerHTML = `<b>${c.handle}</b> ` + esc(text); const cn = document.getElementById('capcount'); if (cn) cn.textContent = `${text.length} / 2.200 caracteres`; };
  btn.disabled = true;
  if (!sampleFn){
    status.textContent = 'IA indisponível aqui. Mostrando um exemplo.';
    setCap(`${p.title.charAt(0)}${p.title.slice(1).toLowerCase()}.\n\nSeparamos o que você precisa saber, do jeito ${(b.tom||['simples'])[0].toLowerCase()} que a gente gosta de falar.\n\nSalva este post e chama a gente no WhatsApp.\n\n#${c.handle}`);
    btn.disabled = false; return;
  }
  status.textContent = 'Escrevendo…';
  try {
    await sampleFn(prompt, { modelTier:'quick', cache:false, onText: ({text}) => { setCap(text); status.textContent = 'Escrevendo…'; } });
    status.textContent = 'Sugestão pronta. Edite à vontade.';
  } catch(e){
    if (e && e.text) setCap(e.text);
    status.textContent = e && (e.code === 'not_granted' || e.code === 'sampling_disabled') ? 'A IA não foi liberada nesta página.' : e && e.code === 'rate_limited' ? 'Muitos pedidos agora. Tente de novo em instantes.' : 'Não deu certo agora. Tente de novo.';
  } finally { btn.disabled = false; }
}

const leadOpen = l => l.stage !== 'ganho' && l.stage !== 'perdido';
const leadLate = l => leadOpen(l) && l.next && diff(l.next.date) < 0;
function nextLabel(l){
  if (!l.next) return '<span class="muted">Sem próximo passo</span>';
  const d = diff(l.next.date);
  const when = d < 0 ? `<span class="late">atrasado ${-d}d</span>` : d === 0 ? '<span class="today">hoje</span>' : `<span class="mono">${ddmm(l.next.date)}</span>`;
  return `${esc(l.next.text)} · ${when}`;
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && (S.ui.open || S.ui.lead)){ S.ui.open = null; S.ui.lead = null; render(); }
  if (e.key === 'Enter' && e.target.id === 'tomnew'){ const v = e.target.value.trim(); if (v){ S.briefs[S.ui.hc || 'c1'].tom.push(v); render(); setTimeout(() => document.getElementById('tomnew')?.focus(), 0); } return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.kcard')){ e.preventDefault(); if (e.target.dataset.ldrag) S.ui.lead = e.target.dataset.id; else S.ui.open = e.target.dataset.id; modal(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.viewas){ if (t.value === 'cliente'){ S.asClient = true; S.ui.ptb = 'aprovar'; } else { S.asClient = false; S.me = t.value; } S.ui.open = null; S.ui.lead = null; render(); toast(S.asClient ? 'Você está vendo o que o cliente vê' : `Vendo como ${person(S.me).name} · ${S.roles[person(S.me).perfil].label}`); return; }
  if (t.dataset.perfil){ person(t.dataset.perfil).perfil = t.value; render(); return; }
  if (t.dataset.rm){ S.remind[t.dataset.rm] = t.dataset.rm === 'dias' ? Number(t.value) : t.value; render(); return; }
  if (t.dataset.cf){ ct(t.dataset.c)[t.dataset.cf] = Math.max(0, Number(t.value) || 0); render(); return; }
  if (t.dataset.cfg){ S.custoHora = Math.max(1, Number(t.value) || 1); render(); return; }
  if (t.dataset.bf){ S.briefs[S.ui.hc || 'c1'][t.dataset.bf] = t.value; return; }
  if (t.dataset.bind){ S.ui[t.dataset.bind] = t.value; if (t.dataset.bind==='cc') S.ui.cp = null; S.ui.adj = null; render(); return; }
  if (t.dataset.lf){
    const l = S.leads.find(x => x.id === S.ui.lead); if (!l) return;
    const f = t.dataset.lf;
    if (f === 'stage') { moveLead(l, t.value); return; }
    if (f === 'valor') l.valor = Math.max(0, Number(t.value) || 0);
    else if (f === 'nexttext') l.next = { text:t.value, date:l.next?.date || addDays(1) };
    else if (f === 'nextdate') l.next = { text:l.next?.text || 'Follow-up', date:t.value || addDays(1) };
    else l[f] = t.value;
    render(); return;
  }
  if (t.dataset.pf){
    const p = S.posts.find(x => x.id === S.ui.open); if (!p) return;
    const f = t.dataset.pf;
    if (f === 'stage'){ if (t.value === 'agendado' && !p.sched){ toast('Para agendar, use a tela de Agendamento.'); t.value = p.stage; return; } setStage(p, t.value); }
    else if (f === 'title') p.title = t.value.toUpperCase().trim() || p.title;
    else p[f] = t.value;
    render();
  }
});

document.addEventListener('dragover', e => { const col = e.target.closest && e.target.closest('[data-drop]'); if (!col || !dragId) return; e.preventDefault(); document.querySelectorAll('.kcol.over').forEach(n => n !== col && n.classList.remove('over')); col.classList.add('over'); });
document.addEventListener('drop', e => {
  const col = e.target.closest && e.target.closest('[data-drop]'); if (!col || !dragId) return; e.preventDefault();
  const p = S.posts.find(x => x.id === dragId), st = col.dataset.drop; dragId = null;
  if (!p || p.stage === st) { render(); return; }
  if (!stagesOf(p).some(s => s.id === st)) { render(); return; }
  if (st === 'agendado'){ toast('Defina data e hora em Agendamento.'); render(); return; }
  setStage(p, st); toast(`Movido para ${stage(st).label} · com ${person(p.owner).name}`); render();
});

function moveLead(l, st){
  if (!l || l.stage === st) { render(); return; }
  l.stage = st;
  if (st === 'ganho' || st === 'perdido') { l.closed = iso(TODAY); l.next = null; }
  l.hist.push({date:iso(TODAY), text:`Movido para ${lstage(st).label}`, who:person(S.me).name});
  toast(st === 'ganho' ? `${l.empresa} fechou! Abra a ficha para virar cliente.` : `Movido para ${lstage(st).label}`);
  render();
}
let dragLead = null;
document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('[data-ldrag]'); if (!c) return; dragLead = c.dataset.ldrag; c.classList.add('dragging'); try { e.dataTransfer.setData('text/plain', dragLead); } catch(_){} });
document.addEventListener('dragover', e => { const col = e.target.closest && e.target.closest('[data-ldrop]'); if (!col || !dragLead) return; e.preventDefault(); document.querySelectorAll('.kcol.over').forEach(n => n !== col && n.classList.remove('over')); col.classList.add('over'); });
document.addEventListener('drop', e => { const col = e.target.closest && e.target.closest('[data-ldrop]'); if (!col || !dragLead) return; e.preventDefault(); const l = S.leads.find(x => x.id === dragLead); dragLead = null; moveLead(l, col.dataset.ldrop); });
document.addEventListener('dragend', () => { dragLead = null; });

function applyBrand(){
  const r = document.documentElement;
  if (S.brand.accent) r.style.setProperty('--accent', S.brand.accent); else r.style.removeProperty('--accent');
}

/* início */
(function(){
  let h = ''; try { h = (location.hash || '').slice(1); } catch(e){}
  if (VIEWS[h]) S.ui.view = h;
  render();
})();
</script>

</body></html>
